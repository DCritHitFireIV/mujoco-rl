engine: brax-mjx
gymnasium_env_id: Reacher-v5
env_name: reacher
backend: mjx
episode_length: 50
action_repeat: 1
seed: 0
num_envs: 2048
num_eval_envs: 128
total_timesteps: 30000000
num_evals: 7
deterministic_eval: true
normalize_observations: true
output_dir: deliverables
ppo:
  learning_rate: 0.0003
  entropy_cost: 0.01
  discounting: 0.97
  unroll_length: 10
  batch_size: 512
  num_minibatches: 40
  num_updates_per_batch: 4
  reward_scaling: 10.0
  clipping_epsilon: 0.3
  gae_lambda: 0.95
  max_grad_norm: 0.5
  normalize_advantage: true
  vf_loss_coefficient: 0.5
  policy_hidden_layer_sizes:
  - 256
  - 256
  value_hidden_layer_sizes:
  - 256
  - 256
  - 256
success:
  max_goal_dist: 0.05
render:
  fps: 30
  width: 480
  height: 480
